name: Unit Tests (Host)

on:
  push:
  pull_request:

jobs:
  host-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (host tests)
        run: cmake -S Core/Test -B build-tests

      - name: Build (host tests)
        run: cmake --build build-tests --config Debug

      - name: Run tests (ctest)
        run: ctest --test-dir build-tests -C Debug --output-on-failure
